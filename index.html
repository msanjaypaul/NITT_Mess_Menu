<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8B2E0B">
    <meta name="description" content="College Mess Menu - Daily Gamble">
    <title>Daily Gamble - Mess Menu</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
        <div class="logo-container">
            <img src="logo.png" alt="Daily Gamble Logo" class="splash-logo">
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="main-app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <img src="logo.png" alt="Daily Gamble Logo" class="header-logo">
                <h1 class="app-title">Daily Gamble</h1>
                <div class="mess-selector">
                    <select id="mess-select" class="mess-dropdown">
                        <option value="main-mess">Main Mess</option>
                        <option value="special-mess">Special Mess</option>
                        <option value="hostel-1-mess">Hostel 1 Mess</option>
                        <option value="hostel-2-mess">Hostel 2 Mess</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Day Selector -->
        <div class="day-selector-container">
            <button id="day-prev" class="day-arrow day-arrow-left">◀</button>
            <div class="day-display">
                <div class="day-display-name" id="day-display-name">Sunday</div>
            </div>
            <button id="day-next" class="day-arrow day-arrow-right">▶</button>
        </div>

        <!-- Menu Content -->
        <main class="menu-content" id="menu-content">
            <div class="meal-section">
                <h2 class="meal-title">
                    <span class="meal-icon">🌅</span>
                    Breakfast
                    <span class="meal-time">7:00 - 9:00 AM</span>
                </h2>
                <div class="menu-items" id="breakfast-items">
                    <div class="menu-item-card">
                        <div class="item-name">Loading...</div>
                    </div>
                </div>
            </div>

            <div class="meal-section">
                <h2 class="meal-title">
                    <span class="meal-icon">☀️</span>
                    Lunch
                    <span class="meal-time">12:00 - 2:00 PM</span>
                </h2>
                <div class="menu-items" id="lunch-items">
                    <div class="menu-item-card">
                        <div class="item-name">Loading...</div>
                    </div>
                </div>
            </div>

            <div class="meal-section">
                <h2 class="meal-title">
                    <span class="meal-icon">🌆</span>
                    Snacks
                    <span class="meal-time">4:00 - 6:00 PM</span>
                </h2>
                <div class="menu-items" id="snacks-items">
                    <div class="menu-item-card">
                        <div class="item-name">Loading...</div>
                    </div>
                </div>
            </div>

            <div class="meal-section">
                <h2 class="meal-title">
                    <span class="meal-icon">🌙</span>
                    Dinner
                    <span class="meal-time">7:30 - 9:30 PM</span>
                </h2>
                <div class="menu-items" id="dinner-items">
                    <div class="menu-item-card">
                        <div class="item-name">Loading...</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p class="footer-text">Last updated: <span id="last-updated">Just now</span></p>
        </footer>
    </div>

    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
